[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codexray"
version = "0.1.0"
description = "Analyze a Python codebase and print a summary"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Adebayo Ayomide", email = "adebayo2001ayomide@gmail.com" }
]
dependencies = [ "openai>=1.0.0"]

[project.scripts]
codexray = "codexray.cli:main"