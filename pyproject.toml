[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codexray"
version = "0.1.0"
description = "Understand a Python codebase in seconds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Adebayo Ayomide", email = "adebayo2001ayomide@gmail.com" }
]
keywords = ["codebase", "analysis", "cli", "developer-tools", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "openai>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Hush-web/codexray"
Repository = "https://github.com/Hush-web/codexray"
Issues = "https://github.com/Hush-web/codexray/issues"

[project.scripts]
codexray = "codexray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
